name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - mem4-cicd-secrets
  pull_request:

permissions:
  contents: read

jobs:
  secrets-check:
    name: Security Gate 5 - Secrets Configuration
    runs-on: ubuntu-22.04
    env:
      ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}

    steps:
      - name: Verify ZAP API key is configured
        shell: bash
        run: |
          if [ -z "$ZAP_API_KEY" ]; then
            echo "ZAP_API_KEY is not configured."
            exit 1
          fi

          echo "ZAP_API_KEY is configured securely."

  semgrep:
    name: Security Gate 1 - Semgrep SAST
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep==1.178.0

      - name: Run Semgrep SAST
        run: semgrep scan --config auto app config server.js

  dependency-audit:
    name: Security Gate 2 - Dependency Audit
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run npm dependency audit
        run: npm audit --audit-level=critical

  gitleaks:
    name: Security Gate 3 - Gitleaks Secrets Scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks on current repository
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --exit-code 1

  trivy:
    name: Security Gate 4 - Trivy Container Scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NodeGoat Docker image
        run: docker build -t nodegoat-security-scan:latest .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nodegoat-security-scan:latest"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true
