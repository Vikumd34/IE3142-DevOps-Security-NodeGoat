name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - mem4-cicd-secrets
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Security Gate 1 - Semgrep SAST
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep==1.178.0

      - name: Run Semgrep SAST
        run: semgrep scan --config auto app config server.js

  dependency-audit:
    name: Security Gate 2 - Dependency Audit
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run npm dependency audit
        run: npm audit --audit-level=critical
